<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VR Min v6 · refSpace-Offset Locomotion</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; color:#fff; font-family:Arial; overflow:hidden; }
  #info { position:fixed; top:0; left:0; right:0; background:rgba(11,22,38,0.92); padding:12px 16px; z-index:10; font-size:14px; }
  #info h1 { margin:0 0 6px 0; color:#FFE298; font-size:18px; letter-spacing:2px; }
  #vrBtn { display:block; margin:14px auto; padding:14px 30px; background:#FFE298; color:#0E1620;
           border:3px solid #FFF0C8; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; }
  #log { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.85); color:#FFE298;
         font-family:monospace; font-size:12px; padding:10px; max-height:25vh; overflow-y:auto;
         border-top:2px solid #6395BD; z-index:10; }
  .ok{color:#7CFF7C} .err{color:#FF5C5C} .warn{color:#FFB347}
</style></head>
<body>
<div id="info">
  <h1>🔬 VR MIN v6 — refSpace-Offset (kein dolly)</h1>
  <div>Theorie: dolly.position-Updates pro Frame sind das Problem. v6 nutzt den eigentlichen WebXR-Standard: XRReferenceSpace.getOffsetReferenceSpace() — Atomic Position-Switch, kein Mid-Frame-Update.</div>
  <button id="vrBtn" onclick="enterVR()">START v6</button>
</div>
<div id="log">[v6]</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const logEl=document.getElementById('log');
function log(m,c){const t=new Date().toTimeString().slice(0,8);
  logEl.innerHTML+='<div class="'+(c||'')+'">['+t+'] '+m+'</div>';logEl.scrollTop=logEl.scrollHeight;
  console.log('[v6]',m);}
log('Three.js '+THREE.REVISION);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14263B);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,100);
// No dolly! camera stays in scene
scene.add(camera);
camera.position.set(0,1.6,3);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

scene.add(new THREE.HemisphereLight(0xffffff, 0x404060, 0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(2,4,3); scene.add(sun);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({color:0x6395BD, roughness:0.85}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const grid=new THREE.GridHelper(30,30,0xFFE298,0xE8862A); grid.position.y=0.01; scene.add(grid);

const box=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),
  new THREE.MeshStandardMaterial({color:0x7CFF7C, emissive:0x114411}));
box.position.set(0,1.0,-2); scene.add(box);
const pR=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2.0,12),
  new THREE.MeshStandardMaterial({color:0xFF5C5C}));
pR.position.set(3,1.0,0); scene.add(pR);
const pL=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2.0,12),
  new THREE.MeshStandardMaterial({color:0x9DDCEE}));
pL.position.set(-3,1.0,0); scene.add(pL);

log('Scene ready (no dolly, refSpace-offset locomotion)', 'ok');

let inVR=false;
let baseRefSpace=null;
let playerX=0, playerZ=3, playerYaw=0;
let snapArmed=true;

function rebuildRefSpace(){
  if(!baseRefSpace) return;
  // XRRigidTransform with NEGATED player position — refSpace is "world from headset"
  // so to move player +X we shift the world -X
  const tx = -playerX;
  const tz = -playerZ;
  // Apply yaw rotation
  const sin = Math.sin(-playerYaw); const cos = Math.cos(-playerYaw);
  const quat = { x: 0, y: Math.sin(-playerYaw/2), z: 0, w: Math.cos(-playerYaw/2) };
  const xform = new XRRigidTransform({x: tx, y: 0, z: tz}, quat);
  const newRef = baseRefSpace.getOffsetReferenceSpace(xform);
  renderer.xr.setReferenceSpace(newRef);
}

window.enterVR=async function(){
  log('enterVR');
  if(!navigator.xr){log('no xr','err');return;}
  let sup=false; try{sup=await navigator.xr.isSessionSupported('immersive-vr');}catch(e){}
  if(!sup){log('no immersive-vr','err');return;}
  let s;
  try{s=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor']});log('session OK','ok');}
  catch(e){try{s=await navigator.xr.requestSession('immersive-vr');log('local fallback','warn');}catch(e2){log('FAIL','err');return;}}
  try{await renderer.xr.setSession(s);log('setSession OK','ok');}
  catch(e){log('setSession FAIL: '+e.message,'err');return;}
  document.getElementById('info').style.display='none';
};

renderer.xr.addEventListener('sessionstart',()=>{
  log('>>> sessionstart','ok');
  inVR=true;
  try{renderer.xr.setFoveation(0);}catch(e){}
  try{baseRefSpace = renderer.xr.getReferenceSpace(); log('base refSpace obtained','ok');}catch(e){log('refSpace err','err');}
  playerX=0; playerZ=3; playerYaw=0;
  rebuildRefSpace();
});
renderer.xr.addEventListener('sessionend',()=>{inVR=false;document.getElementById('info').style.display='';});

let lastTs=performance.now();
function frame(){
  const now=performance.now(); const dt=Math.min(0.05,(now-lastTs)/1000); lastTs=now;
  box.rotation.y+=dt*0.8;
  if(inVR){
    const sess=renderer.xr.getSession();
    let needRebuild=false;
    if(sess) for(const src of sess.inputSources){
      const gp=src.gamepad; if(!gp||!gp.axes)continue;
      const sx=gp.axes[2]||0, sy=gp.axes[3]||0, h=src.handedness;
      if(h==='left' && (Math.abs(sx)>0.15||Math.abs(sy)>0.15)){
        // movement in player's facing direction
        const cs = Math.cos(playerYaw), sn = Math.sin(playerYaw);
        const fwdX = -sn, fwdZ = -cs;   // forward when yaw=0 is -Z
        const rtX = cs, rtZ = -sn;
        const sp = 1.5*dt;
        playerX += fwdX*sp*(-sy) + rtX*sp*sx;
        playerZ += fwdZ*sp*(-sy) + rtZ*sp*sx;
        needRebuild=true;
      }
      if(h==='right'){
        if(Math.abs(sx)>0.7 && snapArmed){
          playerYaw += (sx>0?-1:1)*30*Math.PI/180;
          snapArmed=false; needRebuild=true;
        } else if(Math.abs(sx)<0.3) snapArmed=true;
      }
    }
    if(needRebuild) rebuildRefSpace();
  }
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(frame);
log('loop start','ok');
</script></body></html>
