<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VR Test · GLB-Load r147</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; color:#fff; font-family:Arial; overflow:hidden; }
  #info { position:fixed; top:0; left:0; right:0; background:rgba(11,22,38,0.92); padding:12px 16px; z-index:10; font-size:13px; }
  #info h1 { margin:0 0 6px 0; color:#FFB347; font-size:17px; letter-spacing:2px; }
  #vrBtn { display:block; margin:10px auto; padding:12px 26px; background:#FFB347; color:#0E1620;
           border:3px solid #FFD580; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
  #log { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.88); color:#9DDCEE;
         font-family:monospace; font-size:11px; padding:10px; max-height:30vh; overflow-y:auto;
         border-top:2px solid #6395BD; z-index:10; }
  .ok{color:#7CFF7C} .err{color:#FF5C5C} .warn{color:#FFB347}
</style></head>
<body>
<div id="info">
  <h1>🔬 GLB-Load-Test mit Three.js r147 (UMD)</h1>
  <div>Lädt UL3000.glb + smartspray.glb und zeigt sie an. In VR: grüne Box neben jedem GLB-Objekt wenn geladen, rote wenn fehlgeschlagen.</div>
  <button id="vrBtn" onclick="enterVR()">START GLB-Test</button>
</div>
<div id="log">[r147]</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="smartspray_data.js"></script>
<script src="ul3000_fab_data.js"></script>
<script>
const logEl=document.getElementById('log');
function log(m,c){const t=new Date().toTimeString().slice(0,8);
  logEl.innerHTML+='<div class="'+(c||'')+'">['+t+'] '+m+'</div>';logEl.scrollTop=logEl.scrollHeight;
  console.log('[r147-glb]',m);}

log('Three.js: '+(window.THREE?THREE.REVISION:'MISSING'), THREE?'ok':'err');
log('GLTFLoader: '+(typeof THREE.GLTFLoader==='function'?'verfügbar':'FEHLT'), typeof THREE.GLTFLoader==='function'?'ok':'err');
log('UL3000_GLB_B64: '+(window.UL3000_GLB_B64?'verfügbar ('+window.UL3000_GLB_B64.length+' chars)':'FEHLT'), window.UL3000_GLB_B64?'ok':'err');
log('SMARTSPRAY_GLB_B64: '+(window.SMARTSPRAY_GLB_B64?'verfügbar':'FEHLT'), window.SMARTSPRAY_GLB_B64?'ok':'err');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14263B);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,100);
const dolly=new THREE.Group(); scene.add(dolly); dolly.add(camera); dolly.position.set(0,0,3);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

scene.add(new THREE.HemisphereLight(0xffffff,0x404060,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(2,4,3); scene.add(sun);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({color:0x6395BD,roughness:0.85}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const grid=new THREE.GridHelper(30,30,0xFFE298,0xE8862A); grid.position.y=0.01; scene.add(grid);

// Status-Indicator Boxes (rot/grün je nach load result)
function mkStatusBox(x, label, color){
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),
    new THREE.MeshStandardMaterial({color:color, emissive:color, emissiveIntensity:0.4}));
  b.position.set(x, 1.5, -2.5);
  scene.add(b);
  // Label canvas
  const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const cx=cv.getContext('2d');
  cx.fillStyle='rgba(11,22,38,0.95)'; cx.fillRect(0,0,512,128);
  cx.fillStyle='#fff'; cx.font='bold 38px Arial'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(label, 256, 64);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true});
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4), mat);
  plane.position.set(x, 2.1, -2.5);
  scene.add(plane);
  return b;
}
const ulBox = mkStatusBox(-1.5, 'UL3000 LOADING...', 0xFFB347);
const spBox = mkStatusBox(1.5, 'SPRAY LOADING...', 0xFFB347);

function _b64ToAB(b){
  const bs=atob(b); const l=bs.length; const buf=new Uint8Array(l);
  for(let i=0;i<l;i++) buf[i]=bs.charCodeAt(i);
  return buf.buffer;
}

if (typeof THREE.GLTFLoader === 'function' && window.UL3000_GLB_B64) {
  const ld = new THREE.GLTFLoader();
  log('Starte UL3000 GLB-Parse...');
  ld.parse(_b64ToAB(window.UL3000_GLB_B64), '', function(gltf){
    log('UL3000 OK — '+gltf.scene.children.length+' Kinder', 'ok');
    ulBox.material.color.set(0x7CFF7C);
    ulBox.material.emissive.set(0x114411);
    // Add gltf scene
    gltf.scene.position.set(-3, 0, -4);
    gltf.scene.scale.set(0.8, 0.8, 0.8);
    scene.add(gltf.scene);
  }, function(err){
    log('UL3000 FAIL: '+(err && err.message), 'err');
    ulBox.material.color.set(0xFF3B30);
  });

  log('Starte SmartSpray GLB-Parse...');
  ld.parse(_b64ToAB(window.SMARTSPRAY_GLB_B64), '', function(gltf){
    log('SmartSpray OK — '+gltf.scene.children.length+' Kinder', 'ok');
    spBox.material.color.set(0x7CFF7C);
    spBox.material.emissive.set(0x114411);
    gltf.scene.position.set(3, 0.5, -4);
    gltf.scene.scale.set(2, 2, 2);
    scene.add(gltf.scene);
  }, function(err){
    log('SmartSpray FAIL: '+(err && err.message), 'err');
    spBox.material.color.set(0xFF3B30);
  });
} else {
  log('Kann nicht laden — Library oder Data missing', 'err');
}

let inVR=false, c1=null, c2=null, snapArmed=true;
window.enterVR=async function(){
  if(!navigator.xr) return log('no xr','err');
  let s;
  try{s=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor']});}
  catch(e){try{s=await navigator.xr.requestSession('immersive-vr');}catch(e2){return log('FAIL '+e2.message,'err');}}
  try{await renderer.xr.setSession(s);}catch(e){return log('setSession FAIL '+e.message,'err');}
  document.getElementById('info').style.display='none';
};
renderer.xr.addEventListener('sessionstart',()=>{
  inVR=true;
  try{renderer.xr.setFoveation(0);}catch(e){}
  dolly.position.set(0,0,3); dolly.rotation.set(0,0,0);
  c1=renderer.xr.getController(0); c2=renderer.xr.getController(1);
  dolly.add(c1); dolly.add(c2);
});
renderer.xr.addEventListener('sessionend',()=>{inVR=false;document.getElementById('info').style.display='';});

let lastTs=performance.now();
function frame(){
  const now=performance.now(); const dt=Math.min(0.05,(now-lastTs)/1000); lastTs=now;
  if(inVR){
    const sess=renderer.xr.getSession();
    if(sess) for(const src of sess.inputSources){
      const gp=src.gamepad; if(!gp||!gp.axes)continue;
      const sx=gp.axes[2]||0, sy=gp.axes[3]||0, h=src.handedness;
      if(h==='left' && (Math.abs(sx)>0.15||Math.abs(sy)>0.15)){
        const cam=renderer.xr.getCamera(); const q=new THREE.Quaternion(); cam.getWorldQuaternion(q);
        const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(q); fwd.y=0;
        if(fwd.lengthSq()>0.001) fwd.normalize();
        const rt=new THREE.Vector3(1,0,0).applyQuaternion(q); rt.y=0;
        if(rt.lengthSq()>0.001) rt.normalize();
        dolly.position.addScaledVector(fwd, 1.5*(-sy)*dt);
        dolly.position.addScaledVector(rt, 1.5*sx*dt);
      }
      if(h==='right'){
        if(Math.abs(sx)>0.7 && snapArmed){dolly.rotation.y+=(sx>0?-1:1)*30*Math.PI/180;snapArmed=false;}
        else if(Math.abs(sx)<0.3) snapArmed=true;
      }
    }
  }
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(frame);
log('Animation loop start','ok');
</script>
</body></html>
